swagger: 3.0.0
info:
  title: Mechanic Shop API
  version: 1.0.0
  description: Complete REST API for managing a mechanic shop system with customer management, mechanics, service tickets, and inventory.
host: "127.0.0.1:5000"
schemes:
  - "http"
consumes:
  - "application/json"
produces:
  - "application/json"

tags:
  - name: Authentication
    description: User authentication and authorization endpoints
  - name: Customers
    description: Customer management endpoints
  - name: Mechanics
    description: Mechanic staff management endpoints
  - name: Service Tickets
    description: Service ticket and appointment management
  - name: Inventory
    description: Parts and inventory management

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token required for authentication. Obtain by logging in at POST /login

  schemas:
    # ==================== CUSTOMER SCHEMAS ====================
    Customer:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        phone_number:
          type: string
          example: "215-555-0123"
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00"
      required:
        - id
        - name
        - email
        - phone_number

    CustomerInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        phone_number:
          type: string
          example: "215-555-0123"
      required:
        - name
        - email
        - phone_number

    CustomersResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        customers:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        pagination:
          type: object
          properties:
            current_page:
              type: integer
              example: 1
            total_pages:
              type: integer
              example: 5
            total_customers:
              type: integer
              example: 87
            customers_per_page:
              type: integer
              example: 20
            has_next:
              type: boolean
              example: true
            has_prev:
              type: boolean
              example: false

    # ==================== MECHANIC SCHEMAS ====================
    Mechanic:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Mike Johnson"
        email:
          type: string
          format: email
          example: "mike@mechanicshop.com"
        phone_number:
          type: string
          example: "215-555-0124"
        salary:
          type: number
          format: float
          example: 55000.00
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00"
      required:
        - id
        - name
        - email
        - phone_number
        - salary

    MechanicInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: "Mike Johnson"
        email:
          type: string
          format: email
          example: "mike@mechanicshop.com"
        phone_number:
          type: string
          example: "215-555-0124"
        salary:
          type: number
          format: float
          minimum: 0
          example: 55000.00
      required:
        - name
        - email
        - phone_number
        - salary

    MechanicLeaderboard:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Mike Johnson"
        email:
          type: string
          example: "mike@mechanicshop.com"
        phone_number:
          type: string
          example: "215-555-0124"
        salary:
          type: number
          format: float
          example: 55000.00
        tickets_completed:
          type: integer
          example: 42

    MechanicsLeaderboardResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        leaderboard:
          type: array
          items:
            $ref: '#/components/schemas/MechanicLeaderboard'
        total_mechanics:
          type: integer
          example: 12

    # ==================== SERVICE TICKET SCHEMAS ====================
    ServiceTicket:
      type: object
      properties:
        id:
          type: integer
          example: 1
        customer_id:
          type: integer
          example: 1
        vin:
          type: string
          example: "1HGCM82633A123456"
        service_date:
          type: string
          format: date
          example: "2024-01-20"
        service_description:
          type: string
          example: "Oil change, tire rotation, and brake inspection"
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00"
        mechanics:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              name:
                type: string
                example: "Mike Johnson"
              email:
                type: string
                example: "mike@mechanicshop.com"
      required:
        - id
        - customer_id
        - vin
        - service_date
        - service_description

    ServiceTicketInput:
      type: object
      properties:
        customer_id:
          type: integer
          example: 1
        vin:
          type: string
          example: "1HGCM82633A123456"
        service_date:
          type: string
          example: "01/20/2024"
          description: "Accept formats: MM/DD/YYYY, MM/DD/YY, YYYY-MM-DD, or DD/MM/YYYY"
        service_description:
          type: string
          example: "Oil change, tire rotation, and brake inspection"
      required:
        - customer_id
        - vin
        - service_date
        - service_description

    ServiceTicketEditMechanics:
      type: object
      properties:
        add_ids:
          type: array
          items:
            type: integer
          example: [1, 2, 3]
          description: "List of mechanic IDs to add to the ticket"
        remove_ids:
          type: array
          items:
            type: integer
          example: [4, 5]
          description: "List of mechanic IDs to remove from the ticket"
      required:
        - add_ids
        - remove_ids

    EditMechanicsResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "Mechanics updated successfully"
        ticket:
          $ref: '#/components/schemas/ServiceTicket'

    # ==================== INVENTORY SCHEMAS ====================
    Inventory:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Synthetic Oil 5W-30"
        price:
          type: number
          format: float
          example: 24.99
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00"
      required:
        - id
        - name
        - price

    InventoryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: "Synthetic Oil 5W-30"
        price:
          type: number
          format: float
          minimum: 0
          example: 24.99
      required:
        - name
        - price

    ServiceTicketInventory:
      type: object
      properties:
        inventory_id:
          type: integer
          example: 1
        name:
          type: string
          example: "Synthetic Oil 5W-30"
        price:
          type: number
          format: float
          example: 24.99
        quantity:
          type: integer
          example: 2
        total_cost:
          type: number
          format: float
          example: 49.98

    AddPartToTicketInput:
      type: object
      properties:
        inventory_id:
          type: integer
          example: 1
        quantity:
          type: integer
          minimum: 1
          example: 2
      required:
        - inventory_id

    AddPartResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "Added 2 unit(s) of \"Synthetic Oil 5W-30\" to ticket #1"
        ticket_id:
          type: integer
          example: 1
        inventory_id:
          type: integer
          example: 1
        quantity:
          type: integer
          example: 2

    TicketPartsResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        ticket_id:
          type: integer
          example: 1
        parts:
          type: array
          items:
            $ref: '#/components/schemas/ServiceTicketInventory'
        part_count:
          type: integer
          example: 3

    # ==================== USER/AUTH SCHEMAS ====================
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "admin@mechanicshop.com"
        password:
          type: string
          format: password
          minLength: 1
          example: "securepassword123"
      required:
        - email
        - password

    LoginResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "Successfully Logged In"
        auth_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwiZXhwIjoxNjQwMjk1MzAwLCJpYXQiOjE2NDAyMDg5MDB9.TJVA95OrM7E2cBab30RMHrHDcEfxjoYZgeFONFh7HgQ"

    UserTicket:
      type: object
      properties:
        id:
          type: integer
          example: 1
        customer_id:
          type: integer
          example: 1
        vin:
          type: string
          example: "1HGCM82633A123456"
        service_date:
          type: string
          format: date
          example: "2024-01-20"
        service_description:
          type: string
          example: "Oil change, tire rotation"
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00"

    UserTicketsResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/UserTicket'
        count:
          type: integer
          example: 5

    # ==================== ERROR SCHEMAS ====================
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: "Resource not found"
        error:
          type: string
          example: "The requested resource does not exist"

    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: "Invalid payload"
        errors:
          type: object
          additionalProperties:
            type: string

    SuccessMessage:
      type: object
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "Operation completed successfully"

paths:
  # ==================== AUTHENTICATION ENDPOINTS ====================
  /login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user with email and password. Returns JWT token valid for 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            example:
              email: "admin@mechanicshop.com"
              password: "securepassword123"
      responses:
        '200':
          description: Login successful - JWT token returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                status: "success"
                message: "Successfully Logged In"
                auth_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '400':
          description: Invalid request format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: "Invalid payload"
                errors:
                  email: "Email is required"
                  password: "Password is required"
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Invalid email or password"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /:
    delete:
      tags:
        - Authentication
      summary: Delete authenticated user account
      description: Remove the currently authenticated user's account from the system. Requires valid JWT token in Authorization header.
      security:
        - BearerAuth: []
      responses:
        '204':
          description: User deleted successfully - no response body
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Token is missing!"
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /my-tickets:
    get:
      tags:
        - Authentication
      summary: Get authenticated user's service tickets
      description: Retrieve all service tickets associated with the currently logged-in user. Matches user to customer by email and returns their tickets.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User tickets retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTicketsResponse'
              example:
                status: "success"
                tickets:
                  - id: 1
                    customer_id: 1
                    vin: "1HGCM82633A123456"
                    service_date: "2024-01-20"
                    service_description: "Oil change and filter replacement"
                    created_at: "2024-01-15T10:30:00"
                count: 2
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Token is missing!"
        '404':
          description: User or customer account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== CUSTOMER ENDPOINTS ====================
  /customers:
    post:
      tags:
        - Customers
      summary: Create a new customer
      description: Add a new customer record to the system with name, email, and phone number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
            example:
              name: "John Doe"
              email: "john@example.com"
              phone_number: "215-555-0123"
      responses:
        '201':
          description: Customer created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                id: 1
                name: "John Doe"
                email: "john@example.com"
                phone_number: "215-555-0123"
                created_at: "2024-01-15T10:30:00"
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Customers
      summary: Get all customers with pagination
      description: Retrieve all customers in the system with pagination support (20 customers per page). Results are cached for 60 seconds.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number (starts at 1)
          example: 1
      responses:
        '200':
          description: Customers retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomersResponse'
              example:
                status: "success"
                customers:
                  - id: 1
                    name: "John Doe"
                    email: "john@example.com"
                    phone_number: "215-555-0123"
                    created_at: "2024-01-15T10:30:00"
                pagination:
                  current_page: 1
                  total_pages: 5
                  total_customers: 87
                  customers_per_page: 20
                  has_next: true
                  has_prev: false
        '400':
          description: Invalid page number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Requested page does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /customers/{id}:
    get:
      tags:
        - Customers
      summary: Get customer by ID
      description: Retrieve a single customer's details by their ID. Results are cached for 60 seconds.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: Customer ID
          example: 1
      responses:
        '200':
          description: Customer retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                id: 1
                name: "John Doe"
                email: "john@example.com"
                phone_number: "215-555-0123"
                created_at: "2024-01-15T10:30:00"
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Customers
      summary: Update customer information
      description: Update an existing customer's details. Requires valid JWT token in Authorization header.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: Customer ID to update
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
            example:
              name: "Jane Doe"
              email: "jane@example.com"
              phone_number: "215-555-0199"
      responses:
        '200':
          description: Customer updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                id: 1
                name: "Jane Doe"
                email: "jane@example.com"
                phone_number: "215-555-0199"
                created_at: "2024-01-15T10:30:00"
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Customers
      summary: Delete customer
      description: Remove a customer from the system. Requires valid JWT token in Authorization header.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: Customer ID to delete
          example: 1
      responses:
        '204':
          description: Customer deleted successfully - no response body
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== MECHANIC ENDPOINTS ====================
  /mechanics:
    post:
      tags:
        - Mechanics
      summary: Create a new mechanic
      description: Add a new mechanic to the system. Rate limited to 6 requests per hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MechanicInput'
            example:
              name: "Mike Johnson"
              email: "mike@mechanicshop.com"
              phone_number: "215-555-0124"
              salary: 55000.00
      responses:
        '201':
          description: Mechanic created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mechanic'
              example:
                id: 1
                name: "Mike Johnson"
                email: "mike@mechanicshop.com"
                phone_number: "215-555-0124"
                salary: 55000.00
                created_at: "2024-01-15T10:30:00"
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Rate limit exceeded (maximum 6 mechanics per hour)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Rate limit exceeded"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Mechanics
      summary: Get all mechanics
      description: Retrieve list of all mechanics in the system.
      responses:
        '200':
          description: Mechanics retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Mechanic'
              example:
                - id: 1
                  name: "Mike Johnson"
                  email: "mike@mechanicshop.com"
                  phone_number: "215-555-0124"
                  salary: 55000.00
                  created_at: "2024-01-15T10:30:00"
                - id: 2
                  name: "Sarah Smith"
                  email: "sarah@mechanicshop.com"
                  phone_number: "215-555-0125"
                  salary: 58000.00
                  created_at: "2024-01-16T11:20:00"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /mechanics/{id}:
    get:
      tags:
        - Mechanics
      summary: Get mechanic by ID
      description: Retrieve a single mechanic's details by their ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: Mechanic ID
          example: 1
      responses:
        '200':
          description: Mechanic retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mechanic'
              example:
                id: 1
                name: "Mike Johnson"
                email: "mike@mechanicshop.com"
                phone_number: "215-555-0124"
                salary: 55000.00
                created_at: "2024-01-15T10:30:00"
        '404':
          description: Mechanic not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Mechanics
      summary: Update mechanic information
      description: Update an existing mechanic's details. Requires valid JWT token in Authorization header.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: Mechanic ID to update
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MechanicInput'
            example:
              name: "Michael Johnson"
              email: "michael@mechanicshop.com"
              phone_number: "215-555-0134"
              salary: 57500.00
      responses:
        '200':
          description: Mechanic updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mechanic'
              example:
                id: 1
                name: "Michael Johnson"
                email: "michael@mechanicshop.com"
                phone_number: "215-555-0134"
                salary: 57500.00
                created_at: "2024-01-15T10:30:00"
        '400':
          description: Invalid input data
          content:
            application/json:
